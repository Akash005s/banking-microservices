apiVersion: 1

datasources:
  # =========================
  # LOKI (Logs)
  # =========================
  - name: Loki
    type: loki
    access: proxy
    url: http://gateway:3100
    isDefault: false

  # =========================
  # PROMETHEUS (Metrics)
  # =========================
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true