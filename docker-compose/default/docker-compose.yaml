# ------------------------
# Common blocks
# ------------------------

x-service-defaults: &service-defaults
  mem_limit: 600m
  cpus: "0.5"
  restart: unless-stopped
  networks:
    - easybank
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Used only by CLIENT services
x-client-env: &client-env
  SPRING_PROFILES_ACTIVE: default
  SPRING_CONFIG_IMPORT: configserver:http://config-server:8071/
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8070/eureka/

# ------------------------
# Services
# ------------------------

services:

  # ------------------------
  # OBSERVABILITY  & MONITORING SERVICES
  # ------------------------

  read:
    image: grafana/loki:latest
    <<: *service-defaults
    command: "-config.file=/etc/loki/config.yaml -target=read"
    ports:
      - "3101:3100"
      - "7946"
      - "9095"
    volumes:
      - ../observability/loki/loki-config.yaml:/etc/loki/config.yaml
    depends_on:
      - minio
    healthcheck:
      test: ["CMD","/usr/bin/loki","-health"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      easybank:
        aliases:
          - loki

  write:
    image: grafana/loki:latest
    <<: *service-defaults
    command: "-config.file=/etc/loki/config.yaml -target=write"
    ports:
      - "3102:3100"
      - "7946"
      - "9095"
    volumes:
      - ../observability/loki/loki-config.yaml:/etc/loki/config.yaml
    depends_on:
      - minio
    healthcheck:
      test: ["CMD","/usr/bin/loki","-health"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: grafana/loki:latest
    <<: *service-defaults
    command: "-config.file=/etc/loki/config.yaml -target=backend -legacy-read-mode=false"
    volumes:
      - ../observability/loki/loki-config.yaml:/etc/loki/config.yaml
    depends_on:
      - minio
    healthcheck:
      test: ["CMD","/usr/bin/loki","-health"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 5

  # ------------------------
  # PROMETHEUS
  # ------------------------
  prometheus:
    image: prom/prometheus:latest
    <<: *service-defaults
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../observability/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - account-service
      - loan-service
      - card-service
      - gateway-service
      - eureka-server
      - config-server

  gateway:
    image: nginx:latest
    <<: *service-defaults
    depends_on:
      - read
      - write
    entrypoint:
      - sh
      - -euc
      - |
        cat <<EOF > /etc/nginx/nginx.conf
        user nginx;
        worker_processes 5;
        
        events {
          worker_connections 1000;
        }
        
        http {
          resolver 127.0.0.11;
        
          server {
            listen 3100;
        
            location = / {
              return 200 'OK';
              auth_basic off;
            }
        
            location = /api/prom/push {
              proxy_pass http://write:3100\$$request_uri;
            }
        
            location = /api/prom/tail {
              proxy_pass http://read:3100\$$request_uri;
              proxy_set_header Upgrade \$$http_upgrade;
              proxy_set_header Connection "upgrade";
            }
        
            location ~ /api/prom/.* {
              proxy_pass http://read:3100\$$request_uri;
            }
        
            location = /loki/api/v1/push {
              proxy_pass http://write:3100\$$request_uri;
            }
        
            location = /loki/api/v1/tail {
              proxy_pass http://read:3100\$$request_uri;
              proxy_set_header Upgrade \$$http_upgrade;
              proxy_set_header Connection "upgrade";
            }
        
            location ~ /loki/api/.* {
              proxy_pass http://read:3100\$$request_uri;
            }
          }
        }
        EOF
        /docker-entrypoint.sh nginx -g "daemon off;"
    ports:
      - "3100:3100"

  alloy:
    image: grafana/alloy:latest
    <<: *service-defaults
    volumes:
      - ../observability/alloy/alloy-local-config.yaml:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: >
      run --server.http.listen-addr=0.0.0.0:12345
      --storage.path=/var/lib/alloy/data
      /etc/alloy/config.alloy
    ports:
      - "12345:12345"
    depends_on:
      - gateway

  minio:
    image: minio/minio
    <<: *service-defaults
    command: server /data
    environment:
      MINIO_ROOT_USER: loki
      MINIO_ROOT_PASSWORD: supersecret
      MINIO_PROMETHEUS_AUTH_TYPE: public
      MINIO_UPDATE: off
    ports:
      - "9000:9000"
    volumes:
      - ./.data/minio:/data
    healthcheck:
      test: ["CMD","curl","-f","http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 20s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    <<: *service-defaults
    environment:
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "3000:3000"
    volumes:
      - ../observability/grafana/datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yaml
    depends_on:
      - gateway

  # ------------------------
  # CONFIG SERVER
  # ------------------------

  config-server:
    image: docker.io/akash005s/config-server:1.4
    container_name: config-server
    <<: *service-defaults
    ports:
      - "8071:8071"
    environment:
      SPRING_PROFILES_ACTIVE: git
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:8071/actuator/health/readiness | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ------------------------
  # EUREKA SERVER
  # ------------------------

  eureka-server:
    image: docker.io/akash005s/eureka-server:1.4
    container_name: eureka-server
    <<: *service-defaults
    ports:
      - "8070:8070"
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8071/
      SPRING_APPLICATION_NAME: eurekaserver
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:8070/actuator/health/readiness | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ------------------------
  # ACCOUNT SERVICE
  # ------------------------

  account-service:
    image: docker.io/akash005s/account-service:1.4
    container_name: account-service
    <<: *service-defaults
    ports:
      - "8081:8081"
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      <<: *client-env
      SPRING_APPLICATION_NAME: accounts
    healthcheck:
      test: [ "CMD-SHELL","wget -qO- http://localhost:8081/actuator/health/readiness | grep UP || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  # ------------------------
  # LOAN SERVICE
  # ------------------------

  loan-service:
    image: docker.io/akash005s/loan-service:1.4
    container_name: loan-service
    <<: *service-defaults
    ports:
      - "8091:8091"
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      <<: *client-env
      SPRING_APPLICATION_NAME: loans
    healthcheck:
      test: [ "CMD-SHELL","wget -qO- http://localhost:8091/actuator/health/readiness | grep UP || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  # ------------------------
  # CARD SERVICE
  # ------------------------

  card-service:
    image: docker.io/akash005s/card-service:1.4
    container_name: card-service
    <<: *service-defaults
    ports:
      - "9001:9001"
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      <<: *client-env
      SPRING_APPLICATION_NAME: cards
    healthcheck:
      test: [ "CMD-SHELL","wget -qO- http://localhost:9001/actuator/health/readiness | grep UP || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  # ------------------------
  # GATEWAY SERVICE
  # ------------------------

  gateway-service:
    image: docker.io/akash005s/gateway-server:1.4
    container_name: gateway-service
    <<: *service-defaults
    ports:
      - "8072:8072"
    depends_on:
      account-service:
        condition: service_healthy
      loan-service:
        condition: service_healthy
      card-service:
        condition: service_healthy
    environment:
      <<: *client-env
      SPRING_APPLICATION_NAME: gatewayserver

# ------------------------
# Network
# ------------------------

networks:
  easybank:
    driver: bridge